<style>
:root{
  --bg:#fbf6f4; --card:#ffffff; --ink:#1c1416; --mute:#6b5d60; --line:#e8dcd9;
  --red:#c8102e; --red-d:#9d0b23; --black:#1c1416; --ok:#1b7a3d; --warn:#b26a00;
  --chip:#f6e9e6;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161012; --card:#221a1d; --ink:#f4ecee; --mute:#b4a5a9; --line:#3a2d31;
    --red:#ee3a55; --red-d:#ff6b82; --black:#f4ecee; --ok:#52c27a; --warn:#f0a63c; --chip:#2e2226;
  }
}
:root[data-theme="dark"]{
  --bg:#161012; --card:#221a1d; --ink:#f4ecee; --mute:#b4a5a9; --line:#3a2d31;
  --red:#ee3a55; --red-d:#ff6b82; --black:#f4ecee; --ok:#52c27a; --warn:#f0a63c; --chip:#2e2226;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Tamil',system-ui,sans-serif;line-height:1.6;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
header{background:var(--red);color:#fff;padding:20px 16px 18px;border-bottom:6px solid var(--black)}
header .wrap{max-width:640px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{width:64px;height:64px;border-radius:50%;border:3px solid #fff;background:#fff;flex:none;object-fit:cover}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
header h1{margin:0;font-size:1.5rem;font-weight:800;letter-spacing:.2px}
header p{margin:2px 0 0;font-size:.85rem;opacity:.92}
.hbtn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;
  padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer}
main{max-width:640px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
label.f{display:block;font-weight:700;margin:12px 0 4px;font-size:.95rem}
input[type=text],input[type=tel],input[type=password],select{
  width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--red);outline-offset:1px}
.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.svc input{position:absolute;opacity:0;pointer-events:none}
.svc label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;
  border:2px solid var(--line);border-radius:10px;padding:12px 4px;cursor:pointer;font-weight:700;background:var(--bg)}
.svc label small{font-weight:400;color:var(--mute);font-size:.72rem}
.svc input:checked+label{border-color:var(--red);background:var(--chip);box-shadow:inset 0 -4px 0 var(--red)}
.svc input:focus-visible+label{outline:3px solid var(--red);outline-offset:2px}
.dyn{display:none;border-left:4px solid var(--red);padding-left:12px;margin-top:14px}
.dyn.show{display:block}
.file{border:2px dashed var(--line);border-radius:10px;padding:12px;background:var(--bg)}
.file input{width:100%;font:inherit;font-size:.85rem}
.file .pv{margin-top:8px;display:none;align-items:center;gap:10px;font-size:.8rem;color:var(--mute)}
.file .pv img{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.btn{width:100%;margin-top:18px;background:var(--red);color:#fff;border:0;border-bottom:4px solid var(--red-d);border-radius:10px;
  padding:13px;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-bottom-width:3px;margin-top:8px;font-weight:700}
.msg{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:.92rem;display:none}
.msg.ok{display:block;background:rgba(27,122,61,.12);color:var(--ok);border:1px solid var(--ok)}
.msg.err{display:block;background:rgba(200,16,46,.1);color:var(--red);border:1px solid var(--red)}
h2{font-size:1.1rem;margin:0 0 8px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.hist li:last-child{border:0}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.75rem;font-weight:700;background:var(--chip)}
.tag.done{color:var(--ok)} .tag.wait{color:var(--warn)} .tag.rej{color:var(--red)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem;min-width:560px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{background:var(--chip);position:sticky;top:0}
td a{color:var(--red);font-weight:700;text-decoration:none;margin-right:6px}
td select{padding:4px;font-size:.8rem}
.hide{display:none!important}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.row input,.row select{flex:1;min-width:140px}
.cnt{color:var(--mute);font-size:.85rem}

/* ---- நிர்வாகி பேனல் (அகலமான அமைப்பு) ---- */
body.adm main,body.adm header .wrap{max-width:1100px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{background:var(--chip);border-radius:99px;padding:4px 14px;font-size:.9rem}
.chip.wait b{color:var(--warn)} .chip.done b{color:var(--ok)} .chip.rej b{color:var(--red)}
.tpl{margin:6px 0 12px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--bg)}
.tpl summary{cursor:pointer;font-weight:700}
.tpl textarea{width:100%;margin-top:8px;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:.9rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px;margin-top:8px}
.rc{border:1px solid var(--line);border-left:6px solid var(--warn);border-radius:12px;padding:12px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.rc.done{border-left-color:var(--ok)} .rc.rej{border-left-color:var(--red)}
.rc .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;color:var(--mute)}
.rc .nm{font-size:1.1rem;font-weight:800}
.rc .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rc .meta a{color:var(--red);font-weight:700;text-decoration:none}
.svcchip{background:var(--chip);border-radius:6px;padding:1px 10px;font-weight:700;font-size:.85rem}
.rc .links{display:flex;flex-wrap:wrap;gap:6px}
.rc .links a,.rc .links span{border:1px solid var(--line);border-radius:6px;padding:2px 10px;font-size:.85rem;color:var(--red);font-weight:700;text-decoration:none;background:var(--bg)}
.rc .links span{color:var(--ink)}
.rc select{padding:5px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.85rem;width:auto}
.rc .up,.rc .doc{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px;font-size:.85rem}
.rc .up input[type=file]{width:100%;font:inherit;font-size:.8rem}
.rc button{font:inherit;font-weight:700;border-radius:8px;padding:8px 10px;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.rc button.pri{background:var(--red);color:#fff;border-color:var(--red-d)}
.rc button.wa{background:#1fa855;color:#fff;border-color:#157a3d}
.rc button:disabled{opacity:.6;cursor:wait}
.sendrow{display:flex;gap:6px;flex-wrap:wrap}.sendrow button{flex:1;min-width:130px}
.empty{padding:24px;text-align:center;color:var(--mute)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btnrow .btn{flex:1;min-width:140px;margin-top:0}

/* ---- கேமரா ---- */
.cam{width:100%;margin-top:8px;padding:9px 12px;border:1.5px solid var(--red);border-radius:8px;background:var(--card);color:var(--red);font:inherit;font-weight:700;cursor:pointer}
.rc button.cam{background:var(--card);color:var(--red);border-color:var(--red)}
#camModal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.94);display:none;flex-direction:column;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#camModal.show{display:flex}
#camModal .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
#camModal video,#camModal img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#000}
#camModal img{display:none}
#camModal .bar{display:flex;gap:10px;justify-content:center;padding:12px;flex-wrap:wrap}
#camModal .bar button{font:inherit;font-weight:800;border-radius:99px;border:2px solid #fff;background:transparent;color:#fff;padding:10px 20px;cursor:pointer;min-width:110px}
#camModal .bar button.go{background:var(--red);border-color:var(--red)}
#camModal .bar button.snap{width:76px;height:76px;min-width:0;padding:0;border-radius:50%;background:#fff;border:5px solid var(--red);font-size:0}
#camModal .bar .rv{display:none}
#camModal.review .bar .lv{display:none}
#camModal.review .bar .rv{display:inline-block}
#camModal.review video{display:none}
#camModal.review img{display:block}
</style>

<script>
/* ===== அமைப்பு: உங்கள் Apps Script Web App URL ஐ இங்கே ஒட்டவும் ===== */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4tfVfH85P9PjrK_YMCfQF6a7HErtK_x77CvCE0ZqlED4cA0oHewyK_35rU5V9tRL4OA/exec";
/* ================================================================== */

const $ = id => document.getElementById(id);
const LS_KEY = "danidmk_my_requests";
let adminPin = "", adminRows = [];

/* ---------- பாதுகாப்பான localStorage ---------- */
function lsGet(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"[]"); }catch(e){ return []; } }
function lsSet(v){ try{ localStorage.setItem(LS_KEY, JSON.stringify(v)); }catch(e){} }

/* ---------- சேவை தேர்வு ---------- */
document.querySelectorAll('input[name=svc]').forEach(r=>r.addEventListener('change',()=>{
  ["d1","d2","d3"].forEach(d=>$(d).classList.remove("show"));
  $("d"+({"புதியது":1,"திருத்தம்":2,"நீக்கம்":3}[r.value])).classList.add("show");
  $("msg").className="msg";
}));
const svcVal = () => (document.querySelector('input[name=svc]:checked')||{}).value || "";

/* ---------- கோப்பு முன்னோட்டம் ---------- */
document.querySelectorAll('.file input').forEach(inp=>inp.addEventListener('change',()=>{
  const pv = inp.parentElement.querySelector('.pv'); const f = inp.files[0];
  if(!f){ pv.style.display="none"; return; }
  pv.style.display="flex"; pv.innerHTML="";
  if(f.type.startsWith("image/")){ const im=document.createElement("img"); im.src=URL.createObjectURL(f); pv.appendChild(im); }
  const s=document.createElement("span"); s.textContent=f.name+" ("+Math.round(f.size/1024)+" KB)"; pv.appendChild(s);
}));

/* ---------- படம் சுருக்கி base64 ஆக்கு ---------- */
function readFile(file){
  return new Promise((res,rej)=>{
    if(!file) return res(null);
    if(file.type==="application/pdf"){
      if(file.size>2.5*1024*1024) return rej(new Error("PDF 2.5 MB க்குள் இருக்க வேண்டும்: "+file.name));
      const r=new FileReader(); r.onload=()=>res({name:file.name,mime:file.type,data:r.result.split(",")[1]}); r.onerror=rej; r.readAsDataURL(file); return;
    }
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=1400; let w=img.width,h=img.height;
      if(Math.max(w,h)>max){ const k=max/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
      const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
      const d=c.toDataURL("image/jpeg",0.8).split(",")[1]; URL.revokeObjectURL(url);
      res({name:file.name.replace(/\.[^.]+$/,"")+".jpg",mime:"image/jpeg",data:d});
    };
    img.onerror=()=>rej(new Error("படத்தைப் படிக்க முடியவில்லை: "+file.name));
    img.src=url;
  });
}

/* ---------- Apps Script அழைப்பு ---------- */
async function api(payload){
  if(SCRIPT_URL.startsWith("PASTE")) throw new Error("SCRIPT_URL அமைக்கப்படவில்லை");
  const r = await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
  const j = await r.json(); if(!j.ok) throw new Error(j.error||"பிழை"); return j;
}
function show(el,type,text){ el.className="msg "+type; el.textContent=text; }

/* ---------- பதிவு செய் ---------- */
$("submitBtn").addEventListener("click", async ()=>{
  const m=$("msg"); m.className="msg";
  const name=$("name").value.trim(), mobile=$("mobile").value.trim(), svc=svcVal();
  if(!name) return show(m,"err","பெயரை உள்ளிடவும்");
  if(!/^[6-9]\d{9}$/.test(mobile)) return show(m,"err","சரியான 10 இலக்க செல் நம்பரை உள்ளிடவும்");
  if(!svc) return show(m,"err","சேவையைத் தேர்ந்தெடுக்கவும்");

  const p={action:"submit",name,mobile,service:svc,files:{}};
  const btn=$("submitBtn"); btn.disabled=true; btn.textContent="அனுப்புகிறது…";
  try{
    if(svc==="புதியது"){
      const a=$("f_photo").files[0], b=$("f_aadhaar1").files[0];
      if(!a) throw new Error("புகைப்படத்தைச் சேர்க்கவும்");
      if(!b) throw new Error("ஆதாரைச் சேர்க்கவும்");
      p.files.photo=await readFile(a); p.files.aadhaar=await readFile(b);
    }else if(svc==="திருத்தம்"){
      const a=$("f_voter").files[0], b=$("f_aadhaar2").files[0];
      if(!a) throw new Error("வாக்காளர் அட்டையைச் சேர்க்கவும்");
      if(!b) throw new Error("ஆதாரைச் சேர்க்கவும்");
      p.files.voterCard=await readFile(a); p.files.aadhaar=await readFile(b);
    }else{
      const v=$("voterNo").value.trim().toUpperCase();
      if(v.length<6) throw new Error("சரியான வாக்காளர் எண்ணை உள்ளிடவும்");
      p.voterNo=v;
    }
    const res=await api(p);
    const mine=lsGet(); mine.unshift({id:res.id,name,mobile,service:svc,date:new Date().toISOString()}); lsSet(mine.slice(0,30));
    show(m,"ok","பதிவு வெற்றி! உங்கள் எண்: "+res.id);
    resetForm(); renderHist();
  }catch(e){ show(m,"err",e.message||"பதிவு தோல்வி. மீண்டும் முயலவும்"); }
  btn.disabled=false; btn.textContent="பதிவு செய்";
});
function resetForm(){
  $("name").value=""; $("mobile").value=""; $("voterNo").value="";
  document.querySelectorAll('.file input').forEach(i=>{i.value=""; i.parentElement.querySelector('.pv').style.display="none";});
  document.querySelectorAll('input[name=svc]').forEach(r=>r.checked=false);
  ["d1","d2","d3"].forEach(d=>$(d).classList.remove("show"));
}

/* ---------- என் பதிவுகள் ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function renderHist(){
  const h=lsGet(); $("histCard").style.display=h.length?"block":"none";
  $("hist").innerHTML=h.map(x=>`<li><span><b>${esc(x.id)}</b> · ${esc(x.name)}</span><span class="tag">${esc(x.service)}</span></li>`).join("");
}
renderHist();

/* ---------- நிர்வாகி ---------- */
const TPL_KEY = "danidmk_wa_tpl";
const DEF_TPL = "வணக்கம் {name}, உங்கள் {service} கோரிக்கை ({id}) முடிந்தது ✅\nஆவணம்: {link}\n\n- Dani DMK";
const fileCache = new Map();   // id -> File (இந்த session இல் பதிவேற்றியவை)

try{ $("tpl").value = localStorage.getItem(TPL_KEY) || DEF_TPL; }catch(e){ $("tpl").value = DEF_TPL; }
$("tpl").addEventListener("input",()=>{ try{ localStorage.setItem(TPL_KEY,$("tpl").value); }catch(e){} });

function showAdmin(on){
  $("userView").classList.toggle("hide",on);
  $("adminView").classList.toggle("hide",!on);
  document.body.classList.toggle("adm",on);
}
$("adminBtn").onclick=()=>showAdmin(true);
$("backBtn").onclick=()=>showAdmin(false);
$("outBtn").onclick=()=>{ adminPin=""; adminRows=[]; $("loginBox").classList.remove("hide"); $("listBox").classList.add("hide"); $("pin").value=""; };

async function loadRows(){ const r=await api({action:"list",pin:adminPin}); adminRows=r.rows; renderAdmin(); }
$("loginBtn").onclick=async()=>{
  const pin=$("pin").value.trim(); if(!pin) return;
  const a=$("amsg"); a.className="msg";
  try{ const r=await api({action:"list",pin}); adminPin=pin; adminRows=r.rows;
    $("loginBox").classList.add("hide"); $("listBox").classList.remove("hide"); renderAdmin();
  }catch(e){ show(a,"err",e.message); }
};
$("pin").addEventListener("keydown",e=>{ if(e.key==="Enter") $("loginBtn").click(); });
$("refBtn").onclick=async()=>{ try{ await loadRows(); show($("amsg"),"ok","புதுப்பிக்கப்பட்டது"); }catch(e){ show($("amsg"),"err",e.message); } };
["q","fSvc","fSt"].forEach(i=>$(i).addEventListener("input",renderAdmin));

function links(r){
  const L=[]; const lk=(u,t)=>u?`<a href="${esc(u)}" target="_blank" rel="noopener">${t}</a>`:"";
  L.push(lk(r.photo,"📷 புகைப்படம்"),lk(r.aadhaar,"🪪 ஆதார்"),lk(r.voterCard,"🗳️ வா.அட்டை"));
  if(r.voterNo) L.push(`<span>வா.எண்: ${esc(r.voterNo)}</span>`);
  return L.filter(Boolean).join("");
}
function card(r){
  const cls = r.status==="முடிந்தது"?"done":r.status==="நிராகரிப்பு"?"rej":"";
  const opts = ["நிலுவை","முடிந்தது","நிராகரிப்பு"].map(o=>`<option${o===r.status?" selected":""}>${o}</option>`).join("");
  const id = esc(r.id);
  const doc = r.doneDoc ? `<div class="doc">
      <div class="links"><a href="${esc(r.doneDoc)}" target="_blank" rel="noopener">✅ முடிந்த ஆவணத்தைப் பார்</a></div>
      <div class="sendrow">
        <button class="wa" data-act="wa" data-id="${id}" type="button">WhatsApp ல் அனுப்பு</button>
        <button data-act="share" data-id="${id}" type="button">கோப்பாக பகிர்</button>
      </div></div>` : "";
  return `<div class="rc ${cls}">
    <div class="top"><span><b>${id}</b> · ${esc(r.date)}</span>
      <select data-st="${id}" aria-label="நிலை">${opts}</select></div>
    <div class="nm">${esc(r.name)}</div>
    <div class="meta"><span class="svcchip">${esc(r.service)}</span><a href="tel:${esc(r.mobile)}">📞 ${esc(r.mobile)}</a></div>
    <div class="links">${links(r)}</div>
    ${doc}
    <div class="up">
      <b>${r.doneDoc?"ஆவணத்தை மாற்று":"முடிந்த வேலை ஆவணம்"} (PDF / படம்)</b>
      <input type="file" accept="image/*,application/pdf" data-fid="${id}">
      <button class="cam" data-camfid="${id}" data-facing="environment" type="button">📷 கேமராவில் படம் எடு</button>
      <button class="pri" data-act="done" data-id="${id}" type="button">பதிவேற்று · முடிந்தது எனக் குறி</button>
    </div>
  </div>`;
}
function renderAdmin(){
  const q=$("q").value.trim().toLowerCase(), s=$("fSvc").value, st=$("fSt").value;
  const rows=adminRows.filter(r=>(!s||r.service===s)&&(!st||r.status===st)&&(!q||(r.name+" "+r.mobile+" "+r.id).toLowerCase().includes(q)));
  const c=k=>adminRows.filter(r=>r.status===k).length;
  $("stats").innerHTML=`<span class="chip">மொத்தம் <b>${adminRows.length}</b></span><span class="chip wait">நிலுவை <b>${c("நிலுவை")}</b></span><span class="chip done">முடிந்தது <b>${c("முடிந்தது")}</b></span><span class="chip rej">நிராகரிப்பு <b>${c("நிராகரிப்பு")}</b></span>`;
  $("cnt").textContent="காட்டப்படுவது: "+rows.length;
  $("cards").innerHTML=rows.map(card).join("")||`<div class="empty">பதிவுகள் இல்லை</div>`;
}

/* WhatsApp செய்தி */
function buildMsg(r){
  return ($("tpl").value||DEF_TPL).split("{name}").join(r.name).split("{service}").join(r.service)
    .split("{id}").join(r.id).split("{link}").join(r.doneDoc||"");
}
function openWA(r){
  const num="91"+String(r.mobile).replace(/\D/g,"").slice(-10);
  window.open("https://wa.me/"+num+"?text="+encodeURIComponent(buildMsg(r)),"_blank","noopener");
}
async function getFileObj(r){
  let f=fileCache.get(r.id); if(f) return f;
  const j=await api({action:"getfile",pin:adminPin,id:r.id});
  const bin=atob(j.data), u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  f=new File([u],j.name||(r.id+".pdf"),{type:j.mime||"application/pdf"});
  fileCache.set(r.id,f); return f;
}

/* நிலை மாற்றம் */
$("cards").addEventListener("change",async e=>{
  const sel=e.target.closest("select[data-st]"); if(!sel) return;
  const id=sel.dataset.st;
  try{ await api({action:"status",pin:adminPin,id,status:sel.value});
    const r=adminRows.find(x=>x.id===id); if(r) r.status=sel.value; renderAdmin(); show($("amsg"),"ok",id+" நிலை புதுப்பிக்கப்பட்டது");
  }catch(err){ show($("amsg"),"err",err.message); }
});

/* பொத்தான்கள்: பதிவேற்று / WhatsApp / பகிர் */
$("cards").addEventListener("click",async e=>{
  const btn=e.target.closest("button[data-act]"); if(!btn) return;
  const id=btn.dataset.id, act=btn.dataset.act, a=$("amsg");
  const r=adminRows.find(x=>x.id===id); if(!r) return;

  if(act==="wa"){ openWA(r); return; }

  if(act==="done"){
    const inp=$("cards").querySelector('input[data-fid="'+id+'"]'); const f=inp&&inp.files[0];
    if(!f) return show(a,"err","முடிந்த வேலை ஆவணத்தைத் தேர்ந்தெடுக்கவும்");
    btn.disabled=true; btn.textContent="பதிவேற்றுகிறது…";
    try{
      const file=await readFile(f);
      const res=await api({action:"done",pin:adminPin,id,file});
      r.doneDoc=res.url; r.status="முடிந்தது"; fileCache.set(id,f);
      renderAdmin(); show(a,"ok",id+" — ஆவணம் பதிவேற்றப்பட்டது. இனி WhatsApp ல் அனுப்பலாம்");
    }catch(err){ show(a,"err",err.message||"பதிவேற்றம் தோல்வி"); btn.disabled=false; btn.textContent="பதிவேற்று · முடிந்தது எனக் குறி"; }
    return;
  }

  if(act==="share"){
    if(!navigator.share||!navigator.canShare){ show(a,"err","இந்த சாதனத்தில் கோப்புப் பகிர்வு இல்லை — 'WhatsApp ல் அனுப்பு' (லிங்க்) பயன்படுத்தவும்"); return; }
    try{
      const cached=fileCache.has(id);
      const f=await getFileObj(r);
      if(!navigator.canShare({files:[f]})){ show(a,"err","இந்தக் கோப்பைப் பகிர முடியவில்லை — லிங்க் பயன்படுத்தவும்"); return; }
      if(!cached){ show(a,"ok","கோப்பு தயார். மீண்டும் ஒருமுறை 'கோப்பாக பகிர்' அழுத்தவும்"); return; }
      await navigator.share({files:[f],text:buildMsg(r)});
    }catch(err){ if(err&&err.name!=="AbortError") show(a,"err",err.message||"பகிர்வு தோல்வி"); }
  }
});

$("csvBtn").onclick=()=>{
  const H=["ID","தேதி","பெயர்","செல்","சேவை","வாக்காளர் எண்","புகைப்படம்","ஆதார்","வா.அட்டை","நிலை","முடிந்த ஆவணம்"];
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const csv="\ufeff"+[H.map(q).join(",")].concat(adminRows.map(r=>[r.id,r.date,r.name,r.mobile,r.service,r.voterNo,r.photo,r.aadhaar,r.voterCard,r.status,r.doneDoc].map(q).join(","))).join("\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download="dani-dmk-"+new Date().toISOString().slice(0,10)+".csv"; a.click();
};
/* ---------- கேமரா: நேரடியாகப் படம் எடு ---------- */
let camStream=null, camInput=null, camFacing="environment", camBlob=null;
const camBox=$("camModal"), camVid=$("camVideo"), camImg=$("camShot");

function camMsg(t){ show($("adminView").classList.contains("hide")?$("msg"):$("amsg"),"err",t); }
function setInputFile(input,file){
  try{ const dt=new DataTransfer(); dt.items.add(file); input.files=dt.files;
       input.dispatchEvent(new Event("change",{bubbles:true})); }
  catch(e){ camMsg("படத்தைச் சேர்க்க முடியவில்லை — 'Choose file' மூலம் தேர்ந்தெடுக்கவும்"); }
}
function camStop(){ if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } camVid.srcObject=null; }
function camClose(){ camStop(); camBox.classList.remove("show","review"); camBlob=null; camInput=null; }
async function camStart(){
  camStop(); camBox.classList.remove("review");
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:camFacing},width:{ideal:1920},height:{ideal:1080}},audio:false});
    camVid.srcObject=camStream; await camVid.play();
  }catch(e){
    const inp=camInput; camClose();
    camMsg("கேமரா அனுமதி கிடைக்கவில்லை. Browser இல் கேமரா அனுமதி (Allow) கொடுக்கவும், அல்லது 'Choose file' பயன்படுத்தவும்.");
  }
}
function camOpen(input,facing){
  camInput=input; camFacing=facing||"environment";
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    // பழைய browser: கேமரா செயலியைத் திறக்கும் file input
    const f=document.createElement("input"); f.type="file"; f.accept="image/*"; f.setAttribute("capture",camFacing);
    f.onchange=()=>{ if(f.files[0]) setInputFile(input,f.files[0]); }; f.click(); return;
  }
  camBox.classList.add("show"); camStart();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button[data-camfor],button[data-camfid]"); if(!b) return;
  const input=b.dataset.camfor?$(b.dataset.camfor):$("cards").querySelector('input[data-fid="'+b.dataset.camfid+'"]');
  if(input) camOpen(input,b.dataset.facing);
});
$("camClose").onclick=camClose;
$("camSwitch").onclick=()=>{ camFacing=camFacing==="environment"?"user":"environment"; camStart(); };
$("camSnap").onclick=()=>{
  if(!camVid.videoWidth) return;
  let w=camVid.videoWidth,h=camVid.videoHeight; const max=1600;
  if(Math.max(w,h)>max){ const k=max/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
  const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(camVid,0,0,w,h);
  c.toBlob(b=>{ if(!b) return; camBlob=b; camImg.src=URL.createObjectURL(b); camStop(); camBox.classList.add("review"); },"image/jpeg",0.88);
};
$("camRetake").onclick=()=>camStart();
$("camUse").onclick=()=>{
  if(camBlob&&camInput) setInputFile(camInput,new File([camBlob],"capture_"+Date.now()+".jpg",{type:"image/jpeg"}));
  camClose();
};
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&camBox.classList.contains("show")) camClose(); });
</script>
